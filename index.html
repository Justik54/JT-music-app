<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>JT · без мата</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #08090b;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-hi: rgba(255, 255, 255, 0.075);
    --line: rgba(255, 255, 255, 0.075);
    --text: #f4f7fa;
    --sub: rgba(244, 247, 250, 0.46);
    --faint: rgba(244, 247, 250, 0.2);
    --accent: #3b9dff;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html { background: var(--bg); }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ── ambient glow ─────────────────────────────────────── */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient img {
    position: absolute;
    inset: -25%;
    width: 150%;
    height: 150%;
    object-fit: cover;
    filter: blur(72px) saturate(190%) brightness(0.75);
    opacity: 0;
    transform: scale(1.15);
    transition: opacity 700ms var(--ease-out);
    will-change: opacity;
  }
  .ambient::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(130% 85% at 50% 0%, rgba(8, 9, 11, 0.05) 0%, rgba(8, 9, 11, 0.72) 48%, var(--bg) 92%);
  }

  /* ── layout ───────────────────────────────────────────── */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: calc(10px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  /* ── brand (subtle) ───────────────────────────────────── */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 6px 0 22px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(244, 247, 250, 0.15);
  }
  .brand b {
    font-weight: 700;
    color: rgba(244, 247, 250, 0.3);
    letter-spacing: 0.5em;
  }
  .brand i {
    font-style: normal;
    color: rgba(59, 157, 255, 0.42);
    letter-spacing: 0;
  }

  /* ── cover ────────────────────────────────────────────── */
  .cover-wrap {
    position: relative;
    width: min(68vw, 268px);
    aspect-ratio: 1;
    margin: 0 auto 26px;
    border-radius: 22px;
    background: var(--surface);
    box-shadow:
      0 24px 60px -18px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.055) inset;
    overflow: hidden;
    will-change: transform;
  }
  .cover-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 260ms var(--ease-out);
  }
  .cover-wrap.dim img { opacity: 0; }

  .fav-big {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: rgba(8, 9, 11, 0.42);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    color: rgba(255, 255, 255, 0.82);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 160ms var(--ease-out), color 200ms ease, background 200ms ease;
  }
  .fav-big:active { transform: scale(0.9); }
  .fav-big.on { color: #ff5c8a; background: rgba(255, 92, 138, 0.16); }
  .fav-big.on svg { fill: currentColor; }

  /* ── meta ─────────────────────────────────────────────── */
  .meta { text-align: center; margin-bottom: 22px; }

  .title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.022em;
    line-height: 1.2;
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .artist {
    font-size: 14px;
    color: var(--sub);
    letter-spacing: -0.005em;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .album {
    font-size: 10.5px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── progress ─────────────────────────────────────────── */
  .scrub {
    position: relative;
    height: 26px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
    margin-bottom: 2px;
  }
  .scrub-track {
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .scrub-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: var(--text);
    transition: width 120ms linear;
  }
  .scrub.dragging .scrub-fill { transition: none; }
  .scrub-knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    border-radius: 50%;
    background: #fff;
    transform: translateY(-50%) scale(0);
    transition: transform 180ms var(--ease-spring);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .scrub.dragging .scrub-knob { transform: translateY(-50%) scale(1); }

  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }

  /* ── controls ─────────────────────────────────────────── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
    transition: transform 150ms var(--ease-out), color 200ms ease, opacity 200ms ease;
  }
  .btn:active { transform: scale(0.88); }
  .btn svg { display: block; }

  .btn-side {
    width: 44px;
    height: 44px;
    color: rgba(244, 247, 250, 0.62);
  }
  .btn-side:active { color: var(--text); }

  .btn-sm {
    width: 38px;
    height: 38px;
    color: rgba(244, 247, 250, 0.34);
    position: relative;
  }
  .btn-sm.on { color: var(--accent); }
  .btn-sm.on::after {
    content: "";
    position: absolute;
    bottom: 2px;
    left: 50%;
    margin-left: -1.5px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
  }

  .btn-play {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #fff;
    color: #08090b;
    margin: 0 10px;
    box-shadow: 0 8px 26px -6px rgba(0, 0, 0, 0.7);
    transition: transform 160ms var(--ease-out), background 200ms ease;
    position: relative;
  }
  .btn-play:active { transform: scale(0.93); background: #e9edf2; }

  .icon-swap { position: relative; width: 26px; height: 26px; }
  .icon-swap svg {
    position: absolute;
    inset: 0;
    margin: auto;
    transition: opacity 140ms var(--ease-out), transform 220ms var(--ease-spring);
  }
  .icon-swap .i-pause { opacity: 0; transform: scale(0.55); }
  .playing .icon-swap .i-play { opacity: 0; transform: scale(0.55); }
  .playing .icon-swap .i-pause { opacity: 1; transform: scale(1); }

  /* ── volume ───────────────────────────────────────────── */
  .volume {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 4px;
    margin-bottom: 22px;
    min-height: 24px;
  }
  .volume .btn { color: rgba(244, 247, 250, 0.55); width: 22px; height: 22px; flex-shrink: 0; }
  .volume .btn:active { color: var(--text); }

  .vslider {
    position: relative;
    flex: 1;
    height: 22px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }
  .vslider-track {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .vslider-fill {
    height: 100%;
    width: 100%;
    background: rgba(244, 247, 250, 0.55);
    border-radius: 99px;
  }
  .volume-hint {
    flex: 1;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.01em;
  }

  /* ── tabs ─────────────────────────────────────────────── */
  .tabs {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--surface);
    border-radius: 12px;
    padding: 3px;
    margin: 0 0 16px;
    isolation: isolate;
  }
  .tab-indicator {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc((100% - 6px) / 3);
    border-radius: 9px;
    background: var(--surface-hi);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
    transition: transform 300ms var(--ease-out);
    z-index: -1;
  }
  .tab {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -0.005em;
    padding: 9px 0;
    cursor: pointer;
    transition: color 220ms ease;
    font-family: inherit;
  }
  .tab.active { color: var(--text); }

  /* ── list ─────────────────────────────────────────────── */
  .panel { display: none; }
  .panel.active { display: block; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 13px;
    cursor: pointer;
    transition: background 200ms ease, transform 150ms var(--ease-out);
    position: relative;
  }
  .row:active { transform: scale(0.985); background: var(--surface); }
  .row.playing { background: var(--surface); }

  @media (hover: hover) and (pointer: fine) {
    .row:hover { background: var(--surface); }
  }

  .row-cover {
    width: 46px;
    height: 46px;
    border-radius: 9px;
    object-fit: cover;
    background: var(--surface-hi);
    flex-shrink: 0;
  }
  .row-info { flex: 1; min-width: 0; }
  .row-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.008em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .row.playing .row-title { color: var(--accent); }
  .row-sub {
    font-size: 12px;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-fav {
    width: 34px;
    height: 34px;
    border: none;
    background: none;
    color: rgba(244, 247, 250, 0.2);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 200ms ease, transform 150ms var(--ease-out);
  }
  .row-fav:active { transform: scale(0.85); }
  .row-fav.on { color: #ff5c8a; }
  .row-fav.on svg { fill: currentColor; }

  /* equalizer */
  .eq {
    display: none;
    align-items: flex-end;
    gap: 2px;
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .row.playing .eq { display: flex; }
  .row.playing .row-fav { display: none; }
  .eq span {
    width: 3px;
    border-radius: 1.5px;
    background: var(--accent);
    animation: eq 900ms var(--ease-in-out) infinite alternate;
  }
  .eq span:nth-child(1) { height: 40%; animation-delay: 0ms; }
  .eq span:nth-child(2) { height: 90%; animation-delay: 180ms; }
  .eq span:nth-child(3) { height: 60%; animation-delay: 90ms; }
  body.paused .eq span { animation-play-state: paused; }

  @keyframes eq {
    from { transform: scaleY(0.35); }
    to { transform: scaleY(1); }
  }

  /* ── albums ───────────────────────────────────────────── */
  .album { border-bottom: 1px solid var(--line); }
  .album:last-child { border-bottom: none; }

  .album-head {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 11px 10px;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    border-radius: 13px;
    transition: background 200ms ease, transform 150ms var(--ease-out);
  }
  .album-head:active { transform: scale(0.99); background: var(--surface); }
  @media (hover: hover) and (pointer: fine) {
    .album-head:hover { background: var(--surface); }
  }

  .album-cover {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--surface-hi);
    flex-shrink: 0;
  }
  .album-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.008em;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .album-sub { font-size: 12px; color: var(--sub); }

  .chev {
    color: var(--faint);
    transition: transform 300ms var(--ease-out), color 200ms ease;
    flex-shrink: 0;
  }
  .album.open .chev { transform: rotate(90deg); color: var(--sub); }

  .album-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 320ms var(--ease-out);
  }
  .album.open .album-body { grid-template-rows: 1fr; }
  .album-body-inner { overflow: hidden; min-height: 0; }
  .album-body-inner .row { padding-left: 14px; }

  /* ── empty ────────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 34px 16px;
    color: var(--faint);
    font-size: 13px;
    line-height: 1.55;
  }
  .empty b { display: block; color: var(--sub); font-weight: 600; margin-bottom: 5px; font-size: 14px; }

  /* ── enter animation ──────────────────────────────────── */
  .row, .album {
    animation: rise 380ms var(--ease-out) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      transition-duration: 1ms !important;
    }
    .row, .album { animation: none; }
  }
</style>
</head>
<body>

<div class="ambient"><img id="ambA" alt=""><img id="ambB" alt=""></div>

<div class="app">

  <header class="brand">
    <b>JT</b><i>·</i><span>без мата</span>
  </header>

  <div class="cover-wrap" id="coverWrap">
    <img id="cover" alt="Обложка">
    <button class="fav-big" id="favBtn" aria-label="В избранное">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </button>
  </div>

  <div class="meta">
    <div class="title" id="title">Загрузка</div>
    <div class="artist" id="artist">подождите</div>
    <div class="album" id="album">&nbsp;</div>
  </div>

  <div class="scrub" id="scrub">
    <div class="scrub-track"><div class="scrub-fill" id="scrubFill"></div></div>
    <div class="scrub-knob" id="scrubKnob"></div>
  </div>
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>

  <div class="controls">
    <button class="btn btn-sm" id="shuffleBtn" aria-label="Перемешать">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
    </button>

    <button class="btn btn-side" id="prevBtn" aria-label="Назад">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 5.5a1 1 0 0 1 1 1v11a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1Zm11.7.4a1 1 0 0 1 .3.7v11a1 1 0 0 1-1.55.83l-8.2-5.5a1 1 0 0 1 0-1.66l8.2-5.5a1 1 0 0 1 1.25.13Z"/></svg>
    </button>

    <button class="btn btn-play" id="playBtn" aria-label="Играть">
      <span class="icon-swap">
        <svg class="i-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 4.6a1 1 0 0 1 1.02.05l10 6.9a1 1 0 0 1 0 1.65l-10 6.9A1 1 0 0 1 7.7 19.3V5.7a1 1 0 0 1 .5-.1Z"/></svg>
        <svg class="i-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="4.5" width="4" height="15" rx="1.4"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.4"/></svg>
      </span>
    </button>

    <button class="btn btn-side" id="nextBtn" aria-label="Далее">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 5.5a1 1 0 0 1 1 1v11a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1ZM5.8 5.9a1 1 0 0 1 1.25-.13l8.2 5.5a1 1 0 0 1 0 1.66l-8.2 5.5A1 1 0 0 1 5.5 17.6V6.6a1 1 0 0 1 .3-.7Z"/></svg>
    </button>

    <button class="btn btn-sm" id="repeatBtn" aria-label="Повтор выкл">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>

  <div class="volume" id="volumeRow">
    <button class="btn" id="muteBtn" aria-label="Звук">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" id="volIcon"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <div class="vslider" id="volSlider">
      <div class="vslider-track"><div class="vslider-fill" id="volFill"></div></div>
    </div>
  </div>

  <nav class="tabs">
    <div class="tab-indicator" id="tabInd"></div>
    <button class="tab active" data-tab="all">Все</button>
    <button class="tab" data-tab="fav">Избранное</button>
    <button class="tab" data-tab="albums">Альбомы</button>
  </nav>

  <div class="panel active" id="panelAll"></div>
  <div class="panel" id="panelFav"></div>
  <div class="panel" id="panelAlbums"></div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ══════════════════════════════════════════════════════════
   Конфиг
   ══════════════════════════════════════════════════════════ */
const TRACKS_URLS = [
  'tracks.json',
  'https://raw.githubusercontent.com/Justik54/JT-music-app/main/tracks.json'
];

// URL веб-приложения Google Apps Script (см. apps_script.gs).
// Пустая строка = статистика прослушиваний выключена.
const STATS_URL = '';

const FAV_KEY = 'jt_favs_v1';
const VOL_KEY = 'jt_volume_v1';

const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
  '<rect width="300" height="300" fill="#15181d"/>' +
  '<circle cx="150" cy="150" r="34" fill="none" stroke="#2a3038" stroke-width="6"/>' +
  '<circle cx="150" cy="150" r="7" fill="#2a3038"/>' +
  '</svg>'
);

/* ══════════════════════════════════════════════════════════
   Telegram
   ══════════════════════════════════════════════════════════ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
}

const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ══════════════════════════════════════════════════════════
   Элементы
   ══════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);

const audio = $('audio');
const coverEl = $('cover');
const coverWrap = $('coverWrap');
const favBtn = $('favBtn');
const titleEl = $('title');
const artistEl = $('artist');
const albumEl = $('album');
const scrub = $('scrub');
const scrubFill = $('scrubFill');
const scrubKnob = $('scrubKnob');
const tCur = $('tCur');
const tDur = $('tDur');
const playBtn = $('playBtn');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const shuffleBtn = $('shuffleBtn');
const repeatBtn = $('repeatBtn');
const volumeRow = $('volumeRow');
const volSlider = $('volSlider');
const volFill = $('volFill');
const muteBtn = $('muteBtn');
const volIcon = $('volIcon');
const tabInd = $('tabInd');
const panels = { all: $('panelAll'), fav: $('panelFav'), albums: $('panelAlbums') };

/* ══════════════════════════════════════════════════════════
   Состояние
   ══════════════════════════════════════════════════════════ */
let tracks = [];
let currentIndex = -1;
let queue = [];
let queuePos = -1;
let shuffle = false;
let repeatMode = 0;        // 0 = выкл, 1 = все, 2 = один
let favorites = new Set();
let activeTab = 'all';
const pinged = new Set();

/* ══════════════════════════════════════════════════════════
   Хранилище
   ══════════════════════════════════════════════════════════ */
function loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    favorites = new Set(Array.isArray(raw) ? raw : []);
  } catch (e) { favorites = new Set(); }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch (e) {}
}
function loadVolume() {
  const v = parseFloat(localStorage.getItem(VOL_KEY));
  return isFinite(v) && v >= 0 && v <= 1 ? v : 1;
}
function saveVolume(v) {
  try { localStorage.setItem(VOL_KEY, String(v)); } catch (e) {}
}

const keyOf = (t) => (t.artist || '') + '\u0000' + (t.title || '');

/* ══════════════════════════════════════════════════════════
   Загрузка треков
   ══════════════════════════════════════════════════════════ */
async function fetchTracks() {
  for (const url of TRACKS_URLS) {
    try {
      const res = await fetch(url + '?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('не массив');
      return data;
    } catch (e) {
      console.warn('не удалось загрузить', url, e.message);
    }
  }
  return null;
}

function normalize(t) {
  if (!t || typeof t !== 'object') return null;
  const src = t.src || t.url || t.audio || '';
  if (!src) return null;
  return {
    title: (t.title || 'Без названия').trim(),
    artist: (t.artist || 'Неизвестный').trim(),
    album: (t.album || 'Сингл').trim() || 'Сингл',
    year: String(t.year || '').slice(0, 4),
    src: src,
    cover: t.cover || '',
    duration: Number(t.duration) || 0
  };
}

/* ══════════════════════════════════════════════════════════
   Отрисовка списков
   ══════════════════════════════════════════════════════════ */
function makeRow(index, delay) {
  const t = tracks[index];
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.index = index;
  row.style.animationDelay = Math.min(delay, 240) + 'ms';

  const img = document.createElement('img');
  img.className = 'row-cover';
  img.alt = '';
  img.loading = 'lazy';
  img.src = t.cover || PLACEHOLDER;
  img.onerror = () => { img.src = PLACEHOLDER; };

  const info = document.createElement('div');
  info.className = 'row-info';

  const tt = document.createElement('div');
  tt.className = 'row-title';
  tt.textContent = t.title;

  const ss = document.createElement('div');
  ss.className = 'row-sub';
  ss.textContent = t.artist + ' · ' + t.album;

  info.append(tt, ss);

  const eq = document.createElement('div');
  eq.className = 'eq';
  eq.innerHTML = '<span></span><span></span><span></span>';

  const fav = document.createElement('button');
  fav.className = 'row-fav';
  fav.setAttribute('aria-label', 'В избранное');
  fav.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';
  if (favorites.has(keyOf(t))) fav.classList.add('on');

  fav.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFavorite(index, fav);
  });

  row.append(img, info, eq, fav);
  row.addEventListener('click', () => playIndex(index));

  return row;
}

function renderAll() {
  panels.all.innerHTML = '';
  if (!tracks.length) {
    panels.all.innerHTML = '<div class="empty"><b>Пока пусто</b>Добавь трек через бота</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  tracks.forEach((_, i) => frag.appendChild(makeRow(i, i * 26)));
  panels.all.appendChild(frag);
  syncPlayingRow();
}

function renderFav() {
  panels.fav.innerHTML = '';
  const idx = tracks.map((t, i) => i).filter((i) => favorites.has(keyOf(tracks[i])));
  if (!idx.length) {
    panels.fav.innerHTML = '<div class="empty"><b>В избранном пусто</b>Нажми ♥ у трека, чтобы сохранить</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  idx.forEach((i, n) => frag.appendChild(makeRow(i, n * 26)));
  panels.fav.appendChild(frag);
  syncPlayingRow();
}

function renderAlbums() {
  panels.albums.innerHTML = '';

  const groups = new Map();
  tracks.forEach((t, i) => {
    const name = t.album || 'Сингл';
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(i);
  });

  if (!groups.size) {
    panels.albums.innerHTML = '<div class="empty"><b>Пока пусто</b>Добавь трек через бота</div>';
    return;
  }

  const names = [...groups.keys()].sort((a, b) => a.localeCompare(b, 'ru'));

  names.forEach((name, n) => {
    const idxs = groups.get(name).slice().sort((a, b) =>
      tracks[a].title.localeCompare(tracks[b].title, 'ru')
    );

    const album = document.createElement('div');
    album.className = 'album';
    album.style.animationDelay = Math.min(n * 30, 240) + 'ms';

    const head = document.createElement('button');
    head.className = 'album-head';

    const cov = document.createElement('img');
    cov.className = 'album-cover';
    cov.alt = '';
    cov.loading = 'lazy';
    cov.src = tracks[idxs[0]].cover || PLACEHOLDER;
    cov.onerror = () => { cov.src = PLACEHOLDER; };

    const info = document.createElement('div');
    info.style.cssText = 'flex:1;min-width:0';

    const nm = document.createElement('div');
    nm.className = 'album-name';
    nm.textContent = name;

    const sub = document.createElement('div');
    sub.className = 'album-sub';
    const yrs = [...new Set(idxs.map((i) => tracks[i].year).filter(Boolean))].sort();
    sub.textContent = idxs.length + ' ' + plural(idxs.length, 'трек', 'трека', 'треков') +
      (yrs.length ? ' · ' + yrs.join(', ') : '');

    info.append(nm, sub);

    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

    head.append(cov, info, chev);

    const body = document.createElement('div');
    body.className = 'album-body';
    const inner = document.createElement('div');
    inner.className = 'album-body-inner';
    idxs.forEach((i, k) => inner.appendChild(makeRow(i, k * 24)));
    body.appendChild(inner);

    head.addEventListener('click', () => album.classList.toggle('open'));

    album.append(head, body);
    panels.albums.appendChild(album);
  });

  syncPlayingRow();
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function renderAllPanels() {
  renderAll();
  renderFav();
  renderAlbums();
}

/* ══════════════════════════════════════════════════════════
   Табы
   ══════════════════════════════════════════════════════════ */
document.querySelectorAll('.tab').forEach((btn, i) => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.tab;
    if (name === activeTab) return;
    activeTab = name;

    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === btn));
    tabInd.style.transform = 'translateX(' + (i * 100) + '%)';

    Object.keys(panels).forEach((k) => panels[k].classList.toggle('active', k === name));

    if (name === 'fav') renderFav();

    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }
  });
});

/* ══════════════════════════════════════════════════════════
   Избранное
   ══════════════════════════════════════════════════════════ */
function toggleFavorite(index, btnEl) {
  const key = keyOf(tracks[index]);
  const wasOn = favorites.has(key);

  if (wasOn) favorites.delete(key); else favorites.add(key);
  saveFavs();

  if (btnEl) {
    btnEl.classList.toggle('on', !wasOn);
    if (!wasOn && btnEl.animate) {
      btnEl.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }],
        { duration: 320, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
      );
    }
  }

  syncFavButton();

  if (activeTab === 'fav') {
    renderFav();
  } else {
    document.querySelectorAll('.row').forEach((row) => {
      const i = Number(row.dataset.index);
      const b = row.querySelector('.row-fav');
      if (b && tracks[i]) b.classList.toggle('on', favorites.has(keyOf(tracks[i])));
    });
  }

  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred(wasOn ? 'light' : 'medium'); } catch (e) {}
  }
}

function syncFavButton() {
  if (currentIndex < 0) {
    favBtn.classList.remove('on');
    return;
  }
  favBtn.classList.toggle('on', favorites.has(keyOf(tracks[currentIndex])));
}

/* ══════════════════════════════════════════════════════════
   Ambient + обложка
   ══════════════════════════════════════════════════════════ */
let ambFront = 0;
const ambEls = [$('ambA'), $('ambB')];

function setAmbient(src) {
  const next = ambEls[1 - ambFront];
  const cur = ambEls[ambFront];
  next.onerror = () => { next.style.opacity = '0'; };
  next.src = src;
  next.style.opacity = '0.55';
  cur.style.opacity = '0';
  ambFront = 1 - ambFront;
}

function setCover(src) {
  coverWrap.classList.add('dim');
  const img = new Image();
  img.onload = () => {
    coverEl.src = src;
    coverWrap.classList.remove('dim');
  };
  img.onerror = () => {
    coverEl.src = PLACEHOLDER;
    coverWrap.classList.remove('dim');
  };
  img.src = src;
}

/* ══════════════════════════════════════════════════════════
   Воспроизведение
   ══════════════════════════════════════════════════════════ */
function buildQueue(startIndex) {
  queue = tracks.map((_, i) => i);
  if (shuffle) {
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    const pos = queue.indexOf(startIndex);
    if (pos > 0) [queue[0], queue[pos]] = [queue[pos], queue[0]];
  }
  queuePos = queue.indexOf(startIndex);
}

function loadTrack(index) {
  if (index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const t = tracks[index];

  titleEl.textContent = t.title;
  artistEl.textContent = t.artist;
  albumEl.textContent = t.album + (t.year ? ' · ' + t.year : '');

  setCover(t.cover || PLACEHOLDER);
  setAmbient(t.cover || PLACEHOLDER);

  scrubFill.style.width = '0%';
  scrubKnob.style.left = '0%';
  tCur.textContent = '0:00';
  tDur.textContent = t.duration ? fmt(t.duration) : '0:00';

  audio.src = t.src;
  audio.load();

  syncFavButton();
  syncPlayingRow();
  updateMediaSession(t);

  if (shuffle || !queue.length) buildQueue(index);
  queuePos = queue.indexOf(index);
}

function playIndex(index) {
  if (index === currentIndex && !audio.paused) {
    audio.pause();
    return;
  }
  if (index !== currentIndex) loadTrack(index);
  play();
}

function play() {
  if (currentIndex < 0) return;
  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      setPlayingUI(false);
      artistEl.textContent = 'Нажми ▶ чтобы играть';
    });
  }
}

function togglePlay() {
  if (currentIndex < 0) {
    if (tracks.length) playIndex(0);
    return;
  }
  if (audio.paused) play(); else audio.pause();
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
}

function nextTrack(auto) {
  if (!tracks.length) return;
  if (repeatMode === 2 && auto) {
    audio.currentTime = 0;
    play();
    return;
  }
  if (!queue.length) buildQueue(currentIndex);
  const nextPos = queuePos + 1;
  if (nextPos >= queue.length) {
    if (repeatMode === 0 && auto) {
      audio.pause();
      return;
    }
    queuePos = 0;
  } else {
    queuePos = nextPos;
  }
  loadTrack(queue[queuePos]);
  play();
}

function prevTrack() {
  if (!tracks.length) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  if (!queue.length) buildQueue(currentIndex);
  queuePos = (queuePos - 1 + queue.length) % queue.length;
  loadTrack(queue[queuePos]);
  play();
}

function setPlayingUI(isPlaying) {
  playBtn.classList.toggle('playing', isPlaying);
  document.body.classList.toggle('paused', !isPlaying);
}

function syncPlayingRow() {
  document.querySelectorAll('.row').forEach((row) => {
    row.classList.toggle('playing', Number(row.dataset.index) === currentIndex);
  });
}

function updateMediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: t.artist,
      album: t.album,
      artwork: [{ src: t.cover || PLACEHOLDER, sizes: '512x512' }]
    });
    navigator.mediaSession.setActionHandler('play', () => play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  } catch (e) {}
}

/* ══════════════════════════════════════════════════════════
   Статистика прослушиваний (опционально)
   ══════════════════════════════════════════════════════════ */
function pingPlay(t) {
  if (!STATS_URL) return;
  const key = keyOf(t);
  if (pinged.has(key)) return;
  pinged.add(key);

  const payload = {
    userId: tgUser ? tgUser.id : 0,
    username: tgUser ? (tgUser.username || '') : 'web',
    name: tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : 'Браузер',
    title: t.title,
    artist: t.artist,
    ts: Date.now()
  };

  try {
    fetch(STATS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).catch(() => {});
  } catch (e) {}
}

/* ══════════════════════════════════════════════════════════
   Слайдеры (1:1 перетаскивание)
   ══════════════════════════════════════════════════════════ */
function makeSlider(el, onChange, onCommit) {
  let dragging = false;

  const ratioFromEvent = (e) => {
    const r = el.getBoundingClientRect();
    return Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  };

  el.addEventListener('pointerdown', (e) => {
    dragging = true;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    onChange(ratioFromEvent(e));
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    onChange(ratioFromEvent(e));
  });

  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    if (onCommit) onCommit();
  };

  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ══════════════════════════════════════════════════════════
   Громкость
   ══════════════════════════════════════════════════════════ */
let volume = 1;
let lastVolume = 1;

function paintVolume() {
  volFill.style.width = (volume * 100) + '%';
  const muted = volume <= 0.001;
  muteBtn.style.color = muted ? 'var(--faint)' : '';
  volIcon.innerHTML = muted
    ? '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m17 9 4 6"/><path d="m21 9-4 6"/>'
    : volume < 0.5
      ? '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>'
      : '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
}

function applyVolume() {
  audio.volume = volume;
  audio.muted = volume <= 0.001;
  paintVolume();
}

function setupVolume() {
  volume = loadVolume();
  lastVolume = volume > 0 ? volume : 1;
  applyVolume();

  if (IS_IOS) {
    volumeRow.innerHTML =
      '<span class="volume-hint">Громкость — кнопками телефона</span>';
    return;
  }

  makeSlider(volSlider, (ratio) => {
    volume = Math.round(ratio * 100) / 100;
    applyVolume();
  }, () => {
    saveVolume(volume);
    if (volume > 0) lastVolume = volume;
  });

  muteBtn.addEventListener('click', () => {
    if (volume > 0.001) {
      lastVolume = volume;
      volume = 0;
    } else {
      volume = lastVolume || 1;
    }
    applyVolume();
    saveVolume(volume);
  });
}

/* ══════════════════════════════════════════════════════════
   Форматирование
   ══════════════════════════════════════════════════════════ */
function fmt(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* ══════════════════════════════════════════════════════════
   События
   ══════════════════════════════════════════════════════════ */
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', () => nextTrack(false));
prevBtn.addEventListener('click', prevTrack);

favBtn.addEventListener('click', () => {
  if (currentIndex >= 0) toggleFavorite(currentIndex, null);
});

shuffleBtn.addEventListener('click', () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle('on', shuffle);
  buildQueue(currentIndex >= 0 ? currentIndex : 0);
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
});

repeatBtn.addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  repeatBtn.classList.toggle('on', repeatMode > 0);
  repeatBtn.setAttribute('aria-label',
    repeatMode === 0 ? 'Повтор выкл' : repeatMode === 1 ? 'Повтор всех' : 'Повтор одного');

  const base = '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>';
  const one = '<text x="12" y="15.5" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">1</text>';
  repeatBtn.innerHTML =
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
    base + (repeatMode === 2 ? one : '') + '</svg>';

  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
});

audio.addEventListener('play', () => {
  setPlayingUI(true);
  if (currentIndex >= 0) {
    const t = tracks[currentIndex];
    artistEl.textContent = t.artist;
    pingPlay(t);
  }
});

audio.addEventListener('pause', () => setPlayingUI(false));

audio.addEventListener('loadedmetadata', () => {
  if (isFinite(audio.duration) && audio.duration > 0) {
    tDur.textContent = fmt(audio.duration);
  }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const p = (audio.currentTime / audio.duration) * 100;
  scrubFill.style.width = p + '%';
  scrubKnob.style.left = p + '%';
  tCur.textContent = fmt(audio.currentTime);
});

audio.addEventListener('ended', () => nextTrack(true));

audio.addEventListener('error', () => {
  setPlayingUI(false);
  if (currentIndex >= 0) artistEl.textContent = '⚠️ Не удалось загрузить аудио';
});

audio.addEventListener('waiting', () => {
  if (currentIndex >= 0) artistEl.textContent = 'буферизация…';
});

audio.addEventListener('playing', () => {
  if (currentIndex >= 0) artistEl.textContent = tracks[currentIndex].artist;
});

audio.addEventListener('canplay', () => {
  if (currentIndex >= 0 && !audio.paused) artistEl.textContent = tracks[currentIndex].artist;
});

/* перемотка */
makeSlider(scrub, (ratio) => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const t = ratio * audio.duration;
  scrubFill.style.width = (ratio * 100) + '%';
  scrubKnob.style.left = (ratio * 100) + '%';
  tCur.textContent = fmt(t);
  audio.currentTime = t;
});

/* ══════════════════════════════════════════════════════════
   Старт
   ══════════════════════════════════════════════════════════ */
(async function init() {
  loadFavs();
  setupVolume();

  const raw = await fetchTracks();

  if (raw === null) {
    titleEl.textContent = 'Нет связи';
    artistEl.textContent = 'Не удалось загрузить плейлист';
    coverEl.src = PLACEHOLDER;
    panels.all.innerHTML = '<div class="empty"><b>Плейлист не загрузился</b>Проверь интернет и обнови</div>';
    return;
  }

  tracks = raw.map(normalize).filter(Boolean);
  renderAllPanels();

  if (tracks.length) {
    loadTrack(0);
    buildQueue(0);
  } else {
    titleEl.textContent = 'Плейлист пуст';
    artistEl.textContent = 'Добавь трек через бота';
    coverEl.src = PLACEHOLDER;
    favBtn.style.display = 'none';
  }
})();
</script>
</body>
</html>
