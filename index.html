<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JT Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1318;
      --card-bg: #18202a;
      --accent: #2ea5ff;
      --text-main: #ffffff;
      --text-sub: #8292a1;
      --bar-bg: #263342;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .player-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .cover-wrap {
      width: 220px;
      height: 220px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      margin-bottom: 18px;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .track-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .track-album {
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timeline-container {
      width: 100%;
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--bar-bg);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-play {
      width: 56px;
      height: 56px;
      background: var(--accent);
      border-radius: 50%;
      color: white;
    }

    .playlist-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    .playlist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .playlist-item.active {
      border: 1px solid var(--accent);
    }

    .playlist-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
      overflow: hidden;
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-card">
      <div class="cover-wrap">
        <img id="cover" src="https://placehold.co/300x300/18202a/ffffff?text=JT+Music" alt="Cover">
      </div>
      <div class="track-info">
        <div id="title" class="track-title">Треков пока нет</div>
        <div id="artist" class="track-artist">Ожидание загрузки...</div>
        <div id="album" class="track-album">...</div>
      </div>

      <div class="timeline-container">
        <div class="progress-bar" id="progressBar">
          <div class="progress" id="progress"></div>
        </div>
        <div class="time-info">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="prevBtn">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn btn-play" id="playBtn">
          <svg id="playIcon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" id="nextBtn">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div>
      <div class="playlist-title">Плейлист</div>
      <div class="playlist" id="playlist"></div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let tracks = [];
    let currentIndex = 0;
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const albumEl = document.getElementById('album');
    const coverEl = document.getElementById('cover');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playlistEl = document.getElementById('playlist');

    fetch('tracks.json?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        tracks = data;
        if (tracks.length > 0) {
          renderPlaylist();
          loadTrack(0);
        }
      })
      .catch(err => {
        titleEl.innerText = "Плейлист пуст";
      });

    function loadTrack(index) {
      currentIndex = index;
      const track = tracks[index];
      titleEl.innerText = track.title;
      artistEl.innerText = track.artist;
      albumEl.innerText = track.album || "Сингл";
      coverEl.src = track.cover;
      audio.src = track.url;
      updatePlaylistHighlight();
    }

    function togglePlay() {
      if (!tracks.length) return;
      if (audio.paused) {
        audio.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    playBtn.addEventListener('click', togglePlay);

    nextBtn.addEventListener('click', () => {
      if (!tracks.length) return;
      currentIndex = (currentIndex + 1) % tracks.length;
      loadTrack(currentIndex);
      audio.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });

    prevBtn.addEventListener('click', () => {
      if (!tracks.length) return;
      currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentIndex);
      audio.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      progress.style.width = `${percent}%`;
      currentTimeEl.innerText = formatTime(audio.currentTime);
      durationEl.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audio.currentTime = (clickX / width) * audio.duration;
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.id = `track-${i}`;
        item.innerHTML = `
          <img src="${track.cover}" alt="cover">
          <div class="item-info">
            <div class="item-title">${track.title}</div>
            <div class="item-sub">${track.artist} • ${track.album || 'Сингл'}</div>
          </div>
        `;
        item.addEventListener('click', () => {
          loadTrack(i);
          audio.play();
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        });
        playlistEl.appendChild(item);
      });
    }

    function updatePlaylistHighlight() {
      document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }
  </script>
</body>
</html>
